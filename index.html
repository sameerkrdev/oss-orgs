<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSoC Organizations 2024–2026 | OSS Explorer</title>
  <meta name="description" content="Browse every Google Summer of Code 2024–2026 organization: 253 orgs and 3,419 projects with tech stacks, repos, community channels, funding and contributor PRs.">
  <link rel="canonical" href="https://oss-orgs.vercel.app/">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OSS Explorer">
  <meta property="og:title" content="GSoC Organizations 2024–2026 | OSS Explorer">
  <meta property="og:description" content="Browse every Google Summer of Code 2024–2026 organization: 253 orgs and 3,419 projects with tech stacks, repos, community channels, funding and contributor PRs.">
  <meta property="og:url" content="https://oss-orgs.vercel.app/">
  <meta property="og:image" content="https://oss-orgs.vercel.app/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    // ?p=lfx|sob picks the program: per-program title, description and canonical for search and link previews
    const prog = new URLSearchParams(location.search).get("p");
    const SEO = {
      lfx: ["LFX Mentorship Projects 2024–2026 | OSS Explorer", "Browse LFX Mentorship 2024–2026: 83 Linux Foundation and CNCF projects and 484 mentee projects with repos, skills, mentors and merged PRs."],
      sob: ["Summer of Bitcoin 2026 Organizations | OSS Explorer", "Browse Summer of Bitcoin 2026: 25 Bitcoin and Nostr open-source organizations with repos, tech stacks, mentors and alumni."],
    }[prog];
    if (SEO) {
      document.title = SEO[0];
      for (const [sel, attr, v] of [['meta[name="description"]', "content", SEO[1]], ['meta[property="og:title"]', "content", SEO[0]],
        ['meta[property="og:description"]', "content", SEO[1]], ['meta[property="og:url"]', "content", "https://oss-orgs.vercel.app/?p=" + prog],
        ['link[rel="canonical"]', "href", "https://oss-orgs.vercel.app/?p=" + prog]]) document.querySelector(sel).setAttribute(attr, v);
    }
  </script>
  <script type="application/ld+json">
  {"@context": "https://schema.org", "@type": "WebSite", "name": "OSS Explorer", "url": "https://oss-orgs.vercel.app/",
   "description": "Explorer for Google Summer of Code, LFX Mentorship and Summer of Bitcoin organizations, plus company-backed open-source projects that hire."}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a href="#orgs" class="brand">OSS Explorer</a>
      <nav class="seg progs"><a href="?p=gsoc" data-p="gsoc">GSoC</a><a href="?p=lfx" data-p="lfx">LFX</a><a href="?p=sob" data-p="sob">SoB</a></nav>
      <nav class="tabs">
        <a href="#orgs" data-tab="orgs">Organizations</a>
        <a href="#people" data-tab="people">Contributors</a>
        <a href="#insights" data-tab="insights">Insights</a>
        <a href="oss.html">Hiring OSS</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1 class="sr" id="h1">Google Summer of Code organizations 2024–2026</h1>
    <noscript><p>OSS Explorer lists every Google Summer of Code, LFX Mentorship and Summer of Bitcoin organization with its projects, tech stack, repository and community links. Turn on JavaScript to browse it, or see the <a href="https://github.com/sameerkrdev/oss-orgs">source and data on GitHub</a>.</p></noscript>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search orgs, projects, people, tech" autocomplete="off">
      <div class="seg" id="f-years"></div>
      <select id="f-cat"><option value="">All categories</option></select>
      <select id="f-sort">
        <option value="name">A–Z</option>
        <option value="projects">Most projects</option>
        <option value="stars">Most stars</option>
        <option value="years">Most years</option>
      </select>
      <details class="more-f">
        <summary>Filters<span id="f-count"></span></summary>
        <div class="more-f-body">
          <label>Tech
            <input id="f-tech-in" list="tech-list" placeholder="python, rust, react…">
          </label>
          <datalist id="tech-list"></datalist>
          <div class="chips" id="f-techs"></div>
          <div class="lbl">Community on</div>
          <div class="chips" id="f-plats"></div>
          <button id="reset" class="link">Clear all</button>
        </div>
      </details>
    </div>
    <p class="stats" id="stats"></p>
    <div id="view"></div>
    <div id="more" class="more"></div>
    <footer class="foot" id="gen"></footer>
  </main>

  <script>
    // each data file sets window.DATA
    document.write(`<script src="data/${["lfx", "sob"].includes(prog) ? prog : "gsoc"}.js"><\/script>`);
  </script>
  <script src="app.js"></script>
</body>
</html>
